spring:
  datasource:
    url: jdbc:h2:mem:postage;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  cloud:
