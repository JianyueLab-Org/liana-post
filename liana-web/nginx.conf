server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(liana-auth-service|liana-facility-service|liana-oms-service|liana-dispatch-service|liana-sorting-service|liana-records-service|liana-transport-service|liana-syncer|liana-postage-service)/ {
        proxy_pass http://liana-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
