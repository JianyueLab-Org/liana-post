x-backend-common: &backend-common
  image: liana-post/${SERVICE_NAME:-backend}:demo
  restart: unless-stopped
  build: &backend-build
    context: ./.dist/demo
    dockerfile: ../../Dockerfile.demo
    target: backend
  environment: &backend-env
    NACOS_SERVER_ADDR: nacos:8848
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_DB: 0
    SENTINEL_DASHBOARD: sentinel-dashboard:8858
    SPRING_SQL_INIT_MODE: never
    SPRING_CONFIG_IMPORT: optional:file:/app/no-remote-config.yml
    SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
    SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED: "false"
    DB_USERNAME: root
    DB_PASSWORD: ${LIANA_DB_PASSWORD:?Set LIANA_DB_PASSWORD in .env.demo}
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: ${LIANA_DB_PASSWORD:?Set LIANA_DB_PASSWORD in .env.demo}
    JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Xmx192m
    PACKING_INTERNAL_TOKEN: ${LIANA_PACKING_TOKEN:?Set LIANA_PACKING_TOKEN in .env.demo}
    MANIFEST_INTERNAL_TOKEN: ${LIANA_MANIFEST_TOKEN:?Set LIANA_MANIFEST_TOKEN in .env.demo}
    OMS_SERVICE_URL: http://liana-oms-service:8083
    DISPATCH_SERVICE_URL: http://liana-dispatch-service:8084
    FACILITY_SERVICE_URL: http://liana-facility-service:8082
    SORTING_SERVICE_URL: http://liana-sorting-service:8087
    TRANSPORT_SERVICE_URL: http://liana-transport-service:8086
    TRACKING_SERVICE_URL: http://liana-tracking-service:8085
    POSTAGE_SERVICE_URL: http://liana-postage-service:8090
    POSTAGE_SEED_INITIAL_TARIFF: "false"
  depends_on:
    mysql:
      condition: service_healthy
    database-init:
      condition: service_completed_successfully
    redis:
      condition: service_started
    nacos:
      condition: service_healthy
    sentinel-dashboard:
      condition: service_started

services:
  sentinel-dashboard:
    image: eclipse-temurin:17-jre
    container_name: liana-demo-sentinel-dashboard
    restart: unless-stopped
    command:
      - java
      - -Dserver.port=8858
      - -Dsentinel.dashboard.auth.username=${SENTINEL_USERNAME:-sentinel}
      - -Dsentinel.dashboard.auth.password=${SENTINEL_PASSWORD:-sentinel}
      - -jar
      - /opt/sentinel/sentinel-dashboard-1.8.9.jar
    ports:
      - "8858:8858"
    volumes:
      - ${SENTINEL_HOME:-D:/sentinel}:/opt/sentinel:ro

  mysql:
    image: mysql:8.0
    container_name: liana-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LIANA_DB_PASSWORD:?Set LIANA_DB_PASSWORD in .env.demo}
      TZ: UTC
    ports:
      - "127.0.0.1:${LIANA_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_v2:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: liana-demo-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.2
    container_name: liana-demo-redis
    restart: unless-stopped
    volumes:
      - redis_v2:/data

  database-init:
    image: liana-post/database:demo
    build:
      context: ./.dist/demo
      dockerfile: ../../Dockerfile.demo
      target: database
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LIANA_DB_HOST: mysql
      LIANA_DB_PORT: "3306"
      LIANA_DB_USER: root
      LIANA_DB_PASSWORD: ${LIANA_DB_PASSWORD:?Set LIANA_DB_PASSWORD in .env.demo}
      LIANA_DEMO_PASSWORD: ${LIANA_DEMO_PASSWORD:?Set LIANA_DEMO_PASSWORD in .env.demo}
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Xmx192m
    command: [initialize-demo]

  liana-gateway:
    <<: *backend-common
    image: liana-post/liana-gateway:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-gateway
    environment:
      <<: *backend-env
      TRANSPORT_ROUTE_URI: http://liana-transport-service:8086
      SENTINEL_GATEWAY_ROUTE_ID: tracking-alias
      SENTINEL_GATEWAY_QPS: 2
    ports:
      - "8080:8080"

  liana-auth-service:
    <<: *backend-common
    image: liana-post/liana-auth-service:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-auth-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false

  liana-oms-service:
    <<: *backend-common
    image: liana-post/liana-oms-service:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-oms-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/oms_db?serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false

  liana-dispatch-service:
    <<: *backend-common
    image: liana-post/liana-dispatch-service:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-dispatch-service
    environment:
      <<: *backend-env
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dispatch_db?serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false

  liana-sorting-service:
    <<: *backend-common
    image: liana-post/liana-sorting-service:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-sorting-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sorting_db?serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      SORTING_XRAY_ROOT: /opt/liana/x-ray
    volumes:
      - ./x-ray:/opt/liana/x-ray:ro

  liana-tracking-service:
    # Do not set container_name or host ports here. This service is intended
    # to be scaled in demos with:
    # docker compose -f docker-compose.demo.yml up -d --scale liana-tracking-service=3 liana-tracking-service
    <<: *backend-common
    image: liana-post/liana-tracking-service:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-tracking-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tracking_db?serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false

  liana-facility-service:
    <<: *backend-common
    image: liana-post/liana-facility-service:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-facility-service
    environment:
      <<: *backend-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/facility_db?serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false

  liana-transport-service:
    <<: *backend-common
    image: liana-post/liana-transport-service:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-transport-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/transport_db?serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false

  liana-syncer:
    <<: *backend-common
    image: liana-post/liana-syncer:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-syncer
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/syncer_db?serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    ports:
      - "8089:8089"

  liana-postage-service:
    <<: *backend-common
    image: liana-post/liana-postage-service:demo
    build:
      <<: *backend-build
      args:
        MODULE: liana-postage-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/postage_db?serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      POSTAGE_SQL_INIT_MODE: never

  liana-web:
    image: liana-post/liana-web:demo
    build:
      context: ./liana-web
    container_name: liana-demo-web
    restart: unless-stopped
    depends_on:
      - liana-gateway
    ports:
      - "${LIANA_WEB_PORT:-80}:80"

volumes:
  mysql_v2:
  redis_v2:
